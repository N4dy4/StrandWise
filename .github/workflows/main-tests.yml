name: Main tests

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        run: flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"; exit "${PIPESTATUS[0]}"

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: flutter test 2>&1 | tee "$RUNNER_TEMP/test.log"; exit "${PIPESTATUS[0]}"

      - name: Open GitHub issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TEST: ${{ steps.test.outcome }}
        working-directory: ${{ github.workspace }}
        run: |
          short="${SHA:0:7}"
          title="Tests failed on main ($short)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number')
          {
            echo "Automated test run failed for commit $SHA."
            echo
            echo "- Analyze: $ANALYZE"
            echo "- Test: $TEST"
            echo "- Run: $RUN_URL"
            echo
            echo "<details><summary>Log tail</summary>"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/analyze.log" "$RUNNER_TEMP/test.log" 2>/dev/null | cut -c1-300
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$RUNNER_TEMP/body.md" --label bug
          fi
